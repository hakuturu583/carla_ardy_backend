[project]
name = "carla-ardy-backend"
version = "0.0.0"
description = "ARDY human motion generation served over autoware_carla_scenario's pedestrian motion contract (gRPC)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" },
]
# ARDY is tested on 3.11; its pins (numpy<2, transformers==5.8.1) hold there.
requires-python = ">=3.11,<3.13"
dependencies = [
    "grpcio>=1.60",
    # The vendored modules were generated by autoware_carla_scenario's
    # toolchain (protobuf 4.x gencode), which any later runtime reads.
    "protobuf>=4.25,<7",
]

[project.optional-dependencies]
# The model: what the image installs. Not needed to run the server's tests.
ardy = [
    "ardy",
    # Blackwell (sm_120) needs CUDA 12.8 builds, torch 2.7 and later.
    "torch>=2.7,<3",
]

[project.scripts]
carla-ardy-backend = "carla_ardy_backend.server:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60,<1.63",
    "mypy>=1.19.0",
    "pytest>=9.0.3",
    "ruff>=0.7.4",
]

[tool.uv]
# The image is linux; so is every host it runs on.
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
# nv-tlabs/ardy is not on PyPI: pinned to a commit, bumped on purpose.
ardy = { git = "https://github.com/nv-tlabs/ardy", rev = "e706e27acc88070918308a10922b8f7174d0825e" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/carla_ardy_backend/_proto"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["src/carla_ardy_backend/_proto/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
